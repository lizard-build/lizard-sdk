[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lizard-sdk"
version = "1.0.0"
description = "Python SDK for Lizard (lizard.build): cloud sandboxes for AI agents and code execution."
readme = {file = "README.md", content-type = "text/markdown"}
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
  "sandbox",
  "sandboxes",
  "firecracker",
  "microvm",
  "containers",
  "ai-agents",
  "code-interpreter",
  "code-execution",
  "cloud",
  "paas",
  "lizard",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://lizard.build"
Documentation = "https://lizard.build/docs"
Source = "https://github.com/lizard-build/lizard-sdk"
Issues = "https://github.com/lizard-build/lizard-sdk/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["lizard"]
