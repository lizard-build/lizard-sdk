name: Auto-tag on push to main

on:
  push:
    branches:
      - main

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bumps the patch of the latest tag. To start a new major or minor version,
      # set `version` in packages/python/pyproject.toml (and packages/js/package.json)
      # above the latest tag, e.g. 1.1.0: the next push is tagged with it as is.
      - name: Bump version
        id: bump
        run: |
          latest=$(git tag -l 'v*' --sort=-version:refname | head -1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          version="${latest#v}"
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          patch=$(echo "$version" | cut -d. -f3)
          new_tag="v${major}.${minor}.$((patch + 1))"
          declared=$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/python/pyproject.toml)
          highest=$(printf '%s\n%s\n' "$version" "$declared" | sort -V | tail -1)
          if [ -n "$declared" ] && [ "$declared" != "$version" ] && [ "$highest" = "$declared" ]; then
            new_tag="v$declared"
          fi
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "Bumping $latest → $new_tag"

      # The tag is pushed with the default GITHUB_TOKEN. That intentionally does
      # NOT trigger the tag-based publish workflows (GitHub blocks GITHUB_TOKEN
      # events from starting new runs), so publish-npm / publish-pypi instead key
      # off this workflow's completion via `workflow_run` — which is not blocked.
      - name: Push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin "${{ steps.bump.outputs.new_tag }}"
